[package]
name = "raspberry-agent"
description = "Raspberry Remote Agent — exposes the shared core over HTTP so a Hub on another machine can drive this PC."
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "raspberry-agent"
path = "src/main.rs"

[dependencies]
raspberry-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
rand = "0.8"
dirs = "5"
sysinfo = "0.33"
