<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17171c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="berry" x1="360" y1="300" x2="700" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb2c50"/>
      <stop offset="0.55" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="leaf" x1="470" y1="230" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="berryShine" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background with transparent corners -->
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#glow)"/>
  <!-- hairline stroke -->
  <rect x="33.5" y="33.5" width="957" height="957" rx="230.5" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- leaf -->
  <g transform="translate(512 512)">
    <path d="M0 -196 C -70 -250 -168 -244 -212 -200 C -150 -150 -70 -150 -6 -184 Z"
          fill="url(#leaf)" opacity="0.95"/>
    <path d="M0 -196 C 70 -250 168 -244 212 -200 C 150 -150 70 -150 6 -184 Z"
          fill="url(#leaf)" opacity="0.95"/>

    <!-- berry cluster (offset drupelets) -->
    <g fill="url(#berry)">
      <circle cx="-96" cy="-70" r="58"/>
      <circle cx="0"   cy="-92" r="60"/>
      <circle cx="96"  cy="-70" r="58"/>
      <circle cx="-150" cy="26" r="58"/>
      <circle cx="-50" cy="8"  r="60"/>
      <circle cx="50"  cy="8"  r="60"/>
      <circle cx="150" cy="26" r="58"/>
      <circle cx="-96" cy="110" r="58"/>
      <circle cx="0"   cy="128" r="60"/>
      <circle cx="96"  cy="110" r="58"/>
      <circle cx="-48" cy="210" r="56"/>
      <circle cx="48"  cy="210" r="56"/>
      <circle cx="0"   cy="284" r="52"/>
    </g>
    <!-- soft top-left sheen over the cluster -->
    <g fill="url(#berryShine)">
      <circle cx="0" cy="-92" r="60"/>
      <circle cx="-50" cy="8" r="60"/>
      <circle cx="50" cy="8" r="60"/>
    </g>
  </g>
</svg>
