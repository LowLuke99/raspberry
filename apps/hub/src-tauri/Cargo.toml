[package]
name = "raspberry-hub"
version = "0.1.0"
description = "Raspberry Hub — one glass panel, every machine on your LAN."
authors = ["Papa Luke"]
edition = "2021"
rust-version = "1.77.2"

# The lib is what `main.rs` and (later) mobile targets call into.
[lib]
name = "raspberry_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
