[package]
name = "raspberry-hub"
description = "Raspberry Hub — one glass panel, every machine on your LAN."
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version = "1.77.2"

# The lib is what `main.rs` and (later) mobile targets call into.
[lib]
name = "raspberry_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raspberry-core = { path = "../../../crates/core" }
portable-pty = "0.8"
tokio = { version = "1", features = ["time"] }
